# Dependabot: keeps npm dependencies current, once a month.
# Minor and patch updates arrive together in one pull request; each major update gets its own,
# so breaking changes are reviewed one at a time. Security updates are separate from this
# schedule: they open as soon as an advisory is published, as long as Dependabot alerts and
# security updates are switched on in the repository settings (Settings, Code security).
# The CI workflow (.github/workflows/ci.yml) pins its actions to major versions; only npm is listed.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 broke CI on 30 Oct 2026 (pull request #211). typescript-eslint, which
      # eslint-config-next uses, supports TypeScript below 6.1 only. Revisit when it supports 7.
      - dependency-name: "typescript"
        versions: [">=7"]
      # @types/node must match the Node major the site runs on (22: package.json engines, .nvmrc,
      # CI). The @types/node 26 update broke CI on 30 Oct 2026 (pull request #210). Updates up to 22
      # still arrive.
      - dependency-name: "@types/node"
        versions: [">=23"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
