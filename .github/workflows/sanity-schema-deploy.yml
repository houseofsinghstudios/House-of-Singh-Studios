# Deploys the Sanity schema (workspace hos-studios, dataset production) whenever a push to main changes the
# schema, the Studio config or a file they import, so Sanity's own copy of the content model stays current.
# Tools that validate against the deployed schema (the Sanity MCP server, Agent Actions, Canvas) otherwise
# reject new fields.
#
# Then it registers our own Studio with Sanity: `sanity deploy --external --url
# https://studios.houseofsingh.com/studio` records the existing registration (user application
# h8sx77qg2395sepru27oouhh, urlType external) and refreshes its schema descriptor, which Sanity's tools
# validate against. With --external the CLI builds nothing and uploads no files (Sanity's deploy guide, and
# @sanity/cli's deployStudio: no build and no tarball when external). Plain `sanity deploy`, which builds and
# hosts a separate Studio that falls out of step with the embedded one at /studio, stays forbidden
# (tests/sanity-schema-deploy.test.ts). The embedded Studio updates neither copy on its own.
#
# The token is the GitHub secret SANITY_SCHEMA_DEPLOY_TOKEN: a Sanity project robot token with the
# "Deploy Studio (Token only)" permission (it carries the deployStudio grant that both steps need; no
# write access to content). The CLI reads it from SANITY_AUTH_TOKEN; GitHub masks it in the logs.
name: Sanity schema deploy

on:
  push:
    branches: [main]
    paths:
      - "sanity/**"
      - "sanity.config.ts"
      # Every file under src/ that the Studio config and the schemas import, directly or through their
      # imports. tests/sanity-schema-deploy.test.ts walks the imports and fails when one is missing here.
      - "src/data/services.ts"
      - "src/lib/as-text.ts"
      - "src/lib/constants/booking.ts"
      - "src/lib/constants/homepage-data.ts"
      - "src/lib/homepage-hero.ts"
      - "src/lib/initiatives/types.ts"
      - "src/lib/insights-listing.ts"
      - "src/lib/proof.ts"
      - "src/lib/sanity/project.ts"
      - "src/lib/site-paths.ts"
      - "src/lib/what-we-do.ts"
      - "src/lib/work-index.ts"
  # Run it by hand once the secret is added.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in push order; a newer run waits instead of cancelling one in flight.
concurrency:
  group: sanity-schema-deploy
  cancel-in-progress: false

jobs:
  schema-deploy:
    name: Deploy the Sanity schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_SCHEMA_DEPLOY_TOKEN }}
    steps:
      - name: Check the token is set
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::error::The secret SANITY_SCHEMA_DEPLOY_TOKEN is not set. See the SANITY section of CLAUDE.md."
            exit 1
          fi

      - uses: actions/checkout@v5

      # Sanity needs Node 22.12 or newer; 22.x takes the latest Node 22.
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      # The Sanity version pinned in package-lock.json, the same one the embedded Studio runs.
      - name: Deploy the schema
        run: npx sanity schema deploy --workspace hos-studios --verbose

      # Registers the existing self hosted Studio and refreshes its schema descriptor. --external never
      # builds or uploads a Studio; the URL matches the existing registration, so no new one is made.
      # --schema-required fails the job when the schema cannot be stored, instead of a warning and exit 0.
      - name: Register the self hosted Studio and its schema
        run: npx sanity deploy --external --url https://studios.houseofsingh.com/studio --schema-required
